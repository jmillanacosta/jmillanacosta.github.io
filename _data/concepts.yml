# How scripts/build-concepts.py turns the site's graph into concept pages. The script holds no
# labels, categories, or wording of its own: everything it names, groups, or orders is here.
# Terms are local names in `vocabulary` (e.g. `name` is https://schema.org/name).

# The graphs that are merged (relative to the site root): the pages' own, the collaborators
# around them (graph/collaborators.jsonld: contributors and co-authors, from GitHub, ORCID, and
# Wikidata), and what the sources say of the works (graph/works.jsonld: the software's
# repositories, and the main subjects of the publications on Wikidata).
sources:
  - index.jsonld
  - cv/index.jsonld
  - events/index.jsonld
  - graph/collaborators.jsonld
  - graph/works.jsonld
vocabulary: https://schema.org/
vocabulary_prefix: schema # in the Turtle files

# Files the script reads and writes, relative to the site root.
files:
  shell: concepts/shell.html
  index: concepts/index.json
  sitemap: sitemap.xml # the site's own sitemap; every page written is added to it
  manifest: concepts/manifest.json

# Who the graph is about: the main entity of any page of this type. Their name fills {owner}
# below; links to them go to `home`.
profile:
  type: ProfilePage
  subject: mainEntity
  modified: dateModified # the sitemap's last-modified date
home: /

# Core terms the script reads.
terms:
  name: name
  description: description
  alternate_name: alternateName
  same_as: sameAs
  url: url
  identifier: identifier

# Nodes of these types are never concepts (the site's own pages and files).
excluded_types: [ProfilePage, MediaObject, WebPage]

# Unnamed nodes of these types are concepts in their own right (keyed by type and name); other
# unnamed nodes (roles, grants, counters) are read through as details of what points to them.
unnamed_concept_types:
  - Course
  - EducationalOccupationalProgram
  - Event
  - Organization
  - Periodical
  - Person
  - Place
  - Project
  - Report
  - ResearchProject
  - ScholarlyArticle
  - SoftwareSourceCode

# An unnamed node of these types with exactly the name of an identified node of the same type
# (e.g. an author with an ORCID elsewhere) is taken to be that node.
merge_by_name: [Person]

# What each type is called on its concept page.
type_labels:
  Thing: Skill
  CollegeOrUniversity: University
  Corporation: Company
  Course: Course
  EducationalOccupationalProgram: Study program
  Event: Event
  GovernmentOrganization: Public funder
  Grant: Grant
  Language: Language
  Organization: Organization
  Periodical: Journal
  Person: Collaborator
  DefinedTerm: Topic
  Place: Place
  Project: Community
  Report: Report
  ResearchOrganization: Research institute
  ResearchProject: Research project
  ScholarlyArticle: Publication
  SoftwareSourceCode: Software
  Taxon: Organism
  VirtualLocation: Online

# For untyped nodes: the label given when something points to them with this predicate.
untyped_labels:
  knowsAbout: Skill
untyped_default: Concept

# Each concept lives under its category (/places/lleida-spain/); each category has a page listing
# its members. A category is chosen by type (first match in this order), or by untyped label.
categories:
  - {
      folder: publications,
      title: Publications,
      types: [ScholarlyArticle, Report],
    }
  - { folder: journals, title: Journals, types: [Periodical] }
  - { folder: collaborators, title: Collaborators, types: [Person] }
  - folder: places
    title: Places
    types: [Place]
    lists: location
  - { folder: event, title: Events, types: [Event] }
  - {
      folder: software,
      title: Software,
      many: tools,
      types: [SoftwareSourceCode],
    }
  - { folder: projects, title: Projects, types: [Project, ResearchProject] }
  - { folder: grants, title: Grants, types: [Grant] }
  - folder: courses
    title: Courses and programs
    types: [Course, EducationalOccupationalProgram]
  - { folder: languages, title: Languages, types: [Language] }
  - { folder: organisms, title: Organisms, types: [Taxon] }
  - folder: organizations
    title: Organizations
    types:
      [
        CollegeOrUniversity,
        Corporation,
        GovernmentOrganization,
        ResearchOrganization,
        Organization,
      ]
  - { folder: skills, title: Skills, types: [Thing], labels: [Skill] }
  - { folder: topics, title: Topics, types: [DefinedTerm] }
# `existing: true` marks a category page the site already renders (it is not generated).
# `lists: location` makes the category page list, under each member, what points to it that way.
other_category: { folder: concepts, title: Concepts }

# Text values that sort things into kinds (Hackathon, Journal article). Each kind gets a page
# under the category of what it sorts, in `folder` (/event/kind/hackathon/), next to an index of
# that category's kinds (/event/kind/).
kinds:
  predicates: [keywords, genre]
  folder: kind
  label: Kind

# Predicates shown in the page header rather than as statements.
header: [name, alternateName, description, sameAs, url, identifier]

# Dates: a start and end become one row; things of `open_ended_types` without an end are ongoing.
dates:
  start: startDate
  end: endDate
  single: [datePublished, dateCreated]
  label: When
  open_ended_types: [EmployeeRole]
  open_ended: present
  months: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
  day: "{month} {day}, {year}"
  month: "{month} {year}"
  range_in_month: "{month} {start}–{end}, {year}"
  range: "{start} – {end}"

# Papers: things of these types read as citations wherever they appear, as in the CV's list:
# the title, the authors (the graph's subject in bold; long lists shortened to the first few,
# the subject, and the last), then venue · date · kind · identifier.
citation:
  types: [ScholarlyArticle, Report]
  authors: author
  venue: isPartOf
  dates: [datePublished]
  kind: genre
  number: reportNumber
  identifier: identifier
  shorten: { over: 10, first: 3 }
  gap: " … "

# How unnamed nodes read in one line.
summary:
  headline: [roleName, name] # the first of these present leads the line
  note: description # shown below, in smaller type
  skip: [sameAs, roleName, name, mentions]
  counter: # e.g. "1,554 PyPI downloads last month"
    type: InteractionCounter
    count: userInteractionCount
    source: url
  identifier: # e.g. "ORCID: 0000-…"
    type: PropertyValue
    scheme: propertyID
    value: value

# How a statement reads from its subject's page ("forward") and from its object's page
# ("reverse"). Unlisted predicates are spelled out ("courseCode" → "Course code", "… of").
forward:
  about: About
  alumniOf: Studied at
  maintainer: Maintained by
  programmingLanguage: Written in
  softwareRequirements: Requires
  author: Authors
  codeRepository: Code
  contributor: Contributors
  courseCode: Course code
  credentialCategory: Credential
  dateCreated: Awarded
  datePublished: Published
  downloadUrl: Download
  eventAttendanceMode: Attendance
  funder: Funder
  funding: Funding
  hasCourseInstance: Taught
  interactionStatistic: Usage
  affiliation: Affiliated with
  knowsLanguage: Speaks
  knows: Relations
  isPartOf: Part of
  location: Where
  memberOf: Member of
  parentOrganization: Part of
  provider: Offered by
  recognizedBy: Awarded by
  recordedIn: Recording
  reportNumber: Number
  softwareHelp: Documentation
  softwareVersion: Version
  subjectOf: Described in
  superEvent: Series
  worksFor: Organization
# Forward labels that depend on the object's type.
forward_by_object_type:
  isPartOf: { Periodical: Published in }
reverse:
  about: Subject of
  affiliation: Affiliated
  hasOccupation: Occupation of
  knows: Relations
  maintainer: Maintains
  programmingLanguage: Language of
  softwareRequirements: Required by
  alumniOf: Alumni
  author: Author of
  contributor: Contributor to
  credentialCategory: Credentials
  funder: Funds
  hasCredential: Held by
  instructor: Taught by
  isPartOf: Includes
  knowsAbout: Known by
  knowsLanguage: Spoken by
  location: Based here
  memberOf: Members
  mentions: Mentioned in
  parentOrganization: Includes
  performerIn: Participation
  provider: Offers
  recognizedBy: Awarded
  subjectOf: Describes
  superEvent: Editions
  worksFor: Roles here
# Reverse labels that depend on the subject's type.
reverse_by_subject_type:
  location: { Event: Held here }
  about: { SoftwareSourceCode: Topic of }
reverse_default: "{label} of"
# Predicates never listed as connections.
reverse_skip: [sameAs, url]

# Rows read in this order; the rest follow alphabetically.
order:
  - Kind
  - When
  - Where
  - Series
  - Organization
  - Part of
  - Authors
  - Published
  - Published in
  - Offered by
  - Awarded by
  - Funder
  - Funding
  - Code
  - Documentation
  - Download
  - Version
  - Usage
  - Recording
  - Described in
  - Based here
  - Activity here
  - Roles here
  - Participation
  - Held here
  - Editions
  - Author of
  - Contributor to
  - Members
  - Includes
  - Offers
  - Funds
  - Awarded
  - Alumni

# Names for the places identifiers and links point to, by host.
hosts:
  doi.org: DOI
  github.com: GitHub
  orcid.org: ORCID
  ror.org: ROR
  www.wikidata.org: Wikidata
  purl.obolibrary.org: OBO
  id.loc.gov: Library of Congress
  data.europa.eu: ESCO
  cordis.europa.eu: CORDIS
  pypi.org: PyPI
  hub.docker.com: Docker Hub
  zenodo.org: Zenodo
  scholar.google.com: Google Scholar
  www.linkedin.com: LinkedIn
  linkedin.com: LinkedIn
  openalex.org: OpenAlex
  www.wikipathways.org: WikiPathways
# Other links are named by their address (egonw.github.io); this is for one without an address.
host_default: Website
# Where a link came from: a link target with this statement is shown with its source ("via Wikidata").
provenance: http://purl.org/dc/terms/source
# A link target with this statement is a named profile elsewhere (a Scopus author page, a DBLP
# entry): shown by that name.
link_title: http://purl.org/dc/terms/title
# An identifier given as text is shown with this label, unless a link from that host is shown.
identifier_label: DOI
identity:
  inline: 4
  first: [orcid.org, wikidata.org, github.com, scholar.google.com, linkedin.com]

# Wording. Placeholders in braces are filled by the script.
text:
  title: "{name} · {owner}"
  details: Details
  connections: Connections
  category: Category
  also_known_as: Also known as {names}
  also_listed_as: Also listed as {names}
  via: via {source}
  more: +{count} more
  also_on: Also on
  close: Close
  kind_of: Kind of {of}
  kinds_of: Kinds of {of}
  by_kind: "By kind: {links}"
  other_kinds: Other kinds
  summary: "{kind} in {owner}'s CV graph."
  kind_summary: "{name}: {count} in {owner}'s CV graph."
  category_summary: "{title} in {owner}'s CV graph."
  footer: "Also as {formats} · {schema}"
  through: also through {names}
  others: "{count} more"
  together: "{items} and {last}"
  more_leaves: "{count} more"
  closest: "{name} shares the most connections with {names}."
  topics: " on {names}"
slug_length: 60

# What every generated page offers machines. Its graph (the statements it shows, plus the page
# itself) is embedded as JSON-LD and written next to it in each format, all announced in the head
# with FAIR Signposting (https://signposting.org): describedby and alternate for each format, type
# for what the page and its subject are, author for the graph's subject, and cite-as for a
# subject whose identifier is persistent (one of `persistent_hosts`).
formats:
  - {
      file: index.jsonld,
      type: application/ld+json,
      rdflib: json-ld,
      name: JSON-LD,
    }
  - { file: index.ttl, type: text/turtle, rdflib: turtle, name: Turtle }
  - { file: index.nt, type: application/n-triples, rdflib: nt, name: N-Triples }
signposting:
  page_types: [AboutPage]
  about: about
  author: author
  persistent_hosts: [doi.org, orcid.org, ror.org, www.wikidata.org]

# The content page (/content/): everything in the graph as one table, grouped by category, after
# the site's own pages. `nav` is the page's link in the top bar, marked current there.
content:
  folder: content
  title: Content
  kicker: Overview
  nav: /content/
  pages:
    - { name: Home, path: / }
    - { name: CV, path: /cv/ }
    - { name: My events, path: /events/ }
  pages_title: Pages
  lede: "{count} concepts in {categories} categories."
  filter: Filter by name or kind
  shown: "{shown} of {total}"
  columns: { name: Name, kind: Kind, year: Year, links: Links }
  links_hint: Concepts it is connected to
  schema_link: See how the kinds of concepts connect in the schema.

tree:
  limit: 8
  shared: 2
  closest: 2

# The story on each concept page: how the owner of the site is connected to the concept. Each
# line is a path from the owner: `to` goes to an intermediate thing, `then` goes on from it to the
# concept. Without `then`, `to` goes to the concept itself. A role (an unnamed node) can be the
# intermediate; then its name and dates are shown. The paths are SPARQL property paths. They are
# read by rdfsolve and checked against the mined schema of the site.
story:
  topics: about
  prefixes:
    schema: https://schema.org/
    rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  paths:
    collaborators:
      - label: Between us
        to: schema:knows
        then: schema:knows
        say: ["{name} is my {things}.", "{name} is my {things}."]
      - label: Co-authored
        to: ^(schema:author/rdf:rest*/rdf:first)
        then: schema:author/rdf:rest*/rdf:first
        say:
          [
            "We are co-authors of a publication{topics}.",
            "We are co-authors of {count} publications{topics}.",
          ]
      - label: Contributed to the same software
        to: ^schema:author|^schema:contributor/^schema:contributor
        then: schema:contributor
        say:
          [
            "We have collaborated as contributors to {things}.",
            "We have collaborated as contributors to {things}.",
          ]
      - label: Coworkers at
        to: schema:worksFor|schema:worksFor/schema:worksFor|schema:affiliation
        then: ^schema:worksFor|^schema:affiliation
        say:
          [
            "We have been coworkers at {things}.",
            "We have been coworkers at {things}.",
          ]
      - label: Studied at the same place
        to: schema:alumniOf/schema:alumniOf
        then: ^schema:alumniOf
        say:
          [
            "We have both studied at {things}.",
            "We have both studied at {things}.",
          ]
      - label: Our work presented at
        to: schema:performerIn/schema:performerIn
        then: ^schema:performerIn/schema:subjectOf/schema:author/rdf:rest*/rdf:first
        say:
          [
            "Our joint work was presented at {things}.",
            "Our joint work was presented at {things}.",
          ]
    publications:
      - label: Author
        to: ^(schema:author/rdf:rest*/rdf:first)
      - label: Contributor
        to: ^schema:contributor
      - label: Describes
        to: ^schema:author|^schema:contributor/^schema:contributor
        then: schema:subjectOf
      - label: Presented at
        to: schema:performerIn/schema:performerIn
        then: ^schema:performerIn/schema:subjectOf
    journals:
      - label: Published your papers
        to: ^(schema:author/rdf:rest*/rdf:first)
        then: schema:isPartOf
    event:
      - label: Presented
        to: schema:performerIn
        then: schema:performerIn
    places:
      - label: Events there
        to: schema:performerIn/schema:performerIn
        then: schema:location
      - label: Organizations there
        to: schema:worksFor|schema:worksFor/schema:worksFor|schema:alumniOf/schema:alumniOf
        then: schema:location
    software:
      - label: Author
        to: ^schema:author
      - label: Contributed
        to: ^schema:contributor
        then: ^schema:contributor
      - label: Described in
        to: ^(schema:author/rdf:rest*/rdf:first)
        then: ^schema:subjectOf
    projects:
      - label: Member
        to: schema:memberOf
      - label: Contributor
        to: ^schema:contributor
    grants:
      - label: Funds your project
        to: schema:memberOf
        then: schema:funding
      - label: Funds your report
        to: ^schema:contributor
        then: schema:funding
    organizations:
      - label: Works here
        to: schema:worksFor
      - label: Affiliated
        to: schema:affiliation
      - label: Worked here
        to: schema:worksFor
        then: schema:worksFor
      - label: Studied here
        to: schema:alumniOf
        then: schema:alumniOf
      - label: Includes
        to: schema:worksFor
        then: schema:parentOrganization
      - label: Funded your projects
        to: schema:memberOf
        then: schema:funding/schema:funder
      - label: Taught for
        to: ^schema:instructor/^schema:hasCourseInstance
        then: schema:provider
      - label: Recognized your credentials
        to: schema:hasCredential
        then: schema:recognizedBy
    courses:
      - label: Taught
        to: ^schema:instructor
        then: ^schema:hasCourseInstance
    languages:
      - label: Speaks
        to: schema:knowsLanguage
        then: schema:knowsLanguage
    organisms:
      - label: Studied
        to: schema:alumniOf
        then: schema:about
    skills:
      - label: Listed as a skill
        to: schema:knowsAbout
    concepts:
      - label: Occupation
        to: schema:hasOccupation

# The schema page (/schema/): the graphs of the site are mined by rdfsolve, and the schema is
# drawn as a diagram and given in the formats of rdfsolve.
schema:
  folder: schema
  title: Schema
  kicker: Overview
  dataset: site
  lede: "{classes} classes and {links} links between them, mined from every graph on this site."
  diagram_title: Site RDF schema
  hint: Each class links to what it points to. Point at one to follow its links; open it to see its members.
  list_title: The same, as a list
  graph:
    width: 1200
    height: 860
    inner: [290, 215]
    outer: [520, 375]
    pull: 0.45
    wrap: 16
    char: 7.6
    line: 17
    pad: 12
  downloads_title: Downloads
  schema_file: site.schema.json
  void:
    base: .well-known/void#
    files: [.well-known/void, void.ttl]
    description: "Linked data used to built the site was defined with rdfsolve: each graph, its classes, and the links between them."
  downloads:
    - {
        file: site.schema.json,
        name: rdfsolve schema,
        note: "the mined schema: patterns, counts, and the queries behind them",
      }
    - {
        file: models.py,
        name: Pydantic models,
        note: typed Python classes for each class,
      }
    - { file: shapes.ttl, name: SHACL shapes }
    - {
        file: ../void.ttl,
        name: VoID,
        note: the site's data as it is now,
        with class,
        property,
        and link partitions,
      }
    - { file: schema.linkml.yaml, name: LinkML }
    - { file: diagram.mmd, name: Mermaid diagram }
