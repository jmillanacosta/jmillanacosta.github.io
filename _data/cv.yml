experience:
  - id: doctoral-researcher
    role: Doctoral Researcher
    organization: tgx
    start: 2022-07
    status: PhD defense expected 2026
    description:
      - >-
        Thesis on the interoperability of life sciences data: how independently maintained RDF resources
        can be described, discovered, and queried together, and how the continual revision of the underlying
        databases affects the results of integrating them.
      - >-
        Database description: I developed rdfsolve to mine schemas and paths from SPARQL endpoints and RDF dumps into descriptive (VoID) and prescriptive (SHACL) formats, generate typed Python models, and derive mappings
        across datasets. I maintain a registry of life sciences RDF resources recording what each exposes
        and how it links to the others.
      - >-
        Database evolution: I conceptualized a methodology to capture the historical events of identifier deprecation and label aliasing and supersession across ChEBI, Ensembl, HGNC, HMDB, NCBI, UniProt,
        VGNC, and Wikidata, and compare releases as the basis for measuring how these revisions propagate
        into downstream tools and resources (manuscript in preparation).
    occupation: http://data.europa.eu/esco/occupation/68d973df-bf10-4bf7-9a1b-fbd9f604b9db
  - id: frieslandcampina-internship
    role: Researcher (internship)
    organization: frieslandcampina
    start: 2021-06
    end: 2021-10
    description:
      - Studied the wasting effect of dietary protein intake. Wrote scripts to extract, harmonize, and analyze food-systems and food-composition data from several countries; harmonized it and built dashboards with Power BI.
    occupation: http://data.europa.eu/esco/occupation/d3edb8f8-3a06-47a0-8fb9-9b212c006aa2
  - id: irblleida-internship
    role: Researcher (internship)
    organization: irblleida-neuro
    start: 2018-06
    end: 2018-09
    description:
      - Investigated conditioning in ischemic-stroke recovery using ELISA, RNA extraction, and preparation
        of mouse blood and brain-slice samples.
    occupation: http://data.europa.eu/esco/occupation/31cc4199-703c-4f8a-9b46-a2070a6d35df
