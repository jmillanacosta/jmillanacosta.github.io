skills:
  - name: Knowledge graphs and ontologies
    description:
      RDF, OWL, and SPARQL; SHACL, VoID, and LinkML for schema extraction and validation; ontology
      development with ROBOT and ODK; RDFLib, GraphDB, and SPARQL endpoints; MCP tools over RDF shapes.
  - name: Data integration
    description:
      Identifier and label reconciliation, SSSOM mappings, release comparison, and provenance
      tracking; pandas and Polars.
  - name: Python
    description:
      Libraries and command-line tools with typed APIs and Pydantic models, published on PyPI
      with Sphinx documentation.
  - name: Web services and interfaces
    description:
      Flask and FastAPI backends; Vue, JavaScript, and TypeScript frontends; Cytoscape.js network
      views.
  - name: Testing and delivery
    description:
      pytest, tox, Ruff, and mypy; GitHub Actions, GitLab CI, and Jenkins for tests, data updates,
      and releases; Docker and Slurm.
