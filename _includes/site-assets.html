{%- comment -%}
  Fonts, icons, styles, and scripts shared by every page, including the concept pages. The fonts
  are preloaded and shown only if they arrive at once (font-display: optional in cv.css), so
  text never swaps typeface while being read.
{%- endcomment -%}
    <link
      rel="preload"
      href="{{ '/assets/fonts/source-sans-3-latin-400-normal.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="{{ '/assets/fonts/source-sans-3-latin-600-normal.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="{{ '/assets/fonts/source-sans-3-latin-500-normal.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      href="{{ '/favicon.ico' | relative_url }}"
      sizes="16x16 32x32"
    />
    <link
      rel="apple-touch-icon"
      href="{{ '/apple-touch-icon.png' | relative_url }}"
    />
    <link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}" />
    <script src="{{ '/assets/js/cv-nav.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/concepts.js' | relative_url }}" defer></script>
