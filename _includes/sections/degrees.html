{%- for edu in cv.education %}
<article class="cv-entry">
  <header class="entry-heading">
    <div><h3>{{ edu.degree | escape }}</h3><p class="entry-organization">{% include cv/org.html key=edu.organization %}</p></div>
    <p class="entry-date">{% include cv/dates.html start=edu.start end=edu.end %}</p>
  </header>
  <p>{% include cv/text.html text=edu.description taxa=edu.taxa %}</p>
</article>
{%- endfor %}
