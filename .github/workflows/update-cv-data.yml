name: Update CV data


on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cv-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Refresh data from ORCID and PyPI
        run: python3 scripts/update_cv_data.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- _data; then
            echo "No data changes."
            exit 0
          fi
          git add _data
          git commit -m "Sync CV data from ORCID, PyPI, and GitHub"
          git push
