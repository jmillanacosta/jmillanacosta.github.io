name: Update CV data

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cv-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Refresh publications, events, software, usage, and collaborators data
        run: uv run --locked python scripts/update_cv_data.py
        env:
          # Authenticated GitHub calls (contributors, profiles) are not limited to 60 an hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- _data scripts/cache && [ -z "$(git ls-files --others --exclude-standard _data scripts/cache)" ]; then
            echo "No data changes."
            exit 0
          fi
          git add _data scripts/cache
          git commit -m "Sync CV data from ORCID, Zenodo, PyPI, ecosyste.ms, and GitHub"
          git push
