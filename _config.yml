url: "https://jmillanacosta.github.io"
baseurl: ""
canonical: "https://jmillanacosta.github.io/"
title: "Javier Millán Acosta"
description: "Research software for biomedical knowledge graphs, RDF tooling, and data integration"
# Everything about the person (name, ORCID, work, profiles) is in _data/cv.yml
defaults:
  - scope: { path: "" }
    values:
      image: { path: /assets/og-image.png, width: 1200, height: 630 }
exclude:
  - vendor
  - scripts
  - Gemfile
  - Gemfile.lock
  - README.md
  - tmp
  - node_modules
  - package.json
  - package-lock.json
  - Makefile
  - pyproject.toml
  - uv.lock
  - output
  - schema
  - tests
updates:
  # Slow lookups (Wikidata, ORCID records, GitHub profiles) are cached here and redone after this
  # many days; `--refresh` redoes them at once.
  cache_file: scripts/cache/collaborators.json
  cache_days: 30
  # Accounts that commit to repositories but are not people, besides those GitHub marks as bots.
  ignored_accounts: [actions-user, github-actions, web-flow, ghost]
  # Files in repositories that list authors with their ORCID iDs.
  citation_files: [CITATION.cff, .zenodo.json, codemeta.json]
  # ORCID work types that are talks or posters: they go to events, not publications.
  event_work_types: [lecture-speech, conference-poster]
  # Wikidata properties that are never published: sex or gender (P21).
  wikidata_withheld: [P21]
  # The OpenAlex topics of a work are kept from this score (0 to 1); the first topic scores highest.
  topic_score: 0.5
plugins:
  - jekyll-seo-tag
# Concept pages, page graphs, the schema page and VoID are written into _site after the build
# (make concepts), the concept pages each under their category, and the CV PDF (make pdf) into
# cv/; keep them across rebuilds while serving.
keep_files:
  - index.
  - cv/
  - events/index.
  - graph
  - void.ttl
  - .well-known
  - concepts
  - content
  - courses
  - event
  - grants
  - journals
  - languages
  - organisms
  - organizations
  - collaborators
  - places
  - projects
  - schema
  - tests
  - publications
  - skills
  - topics
  - software
